<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jam Check-in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f2ef;--card:#fff;--ink:#17171c;--mute:#6b6b75;--line:#dcdad4;--amber:#a86a00;--ok:#1d7a4a;--okbg:#dff3e7;--bad:#b3261e;--badbg:#fbe3e1;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e0e11;--card:#1a1a20;--ink:#f2f0ea;--mute:#9a9aa6;--line:#2c2c35;--amber:#ffc000;--ok:#5fd18f;--okbg:#10301f;--bad:#ff7b72;--badbg:#3a1614;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.35 Barlow,system-ui,-apple-system,Segoe UI,sans-serif;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top,0) 14px calc(60px + env(safe-area-inset-bottom,0))}
h1,h2,.tm,.stat b{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.01em}
.dt{display:flex;gap:8px;align-items:center;margin-top:8px}.dt input{font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}.dt .pill{padding:7px 14px}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
h1{font-size:28px;margin:0;line-height:1}.sub{color:var(--mute);font-size:13px;margin-top:2px}
.stats{display:flex;gap:10px;margin:10px 0}.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{font-size:30px;line-height:1;color:var(--amber)}.stat span{display:block;color:var(--mute);font-size:13px}
.tabs{display:flex;gap:6px}.tabs button,.pill{font:600 15px Barlow,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button{flex:1;min-width:0;padding-left:8px;padding-right:8px}.on,.pill.go{background:var(--amber)!important;color:#111!important;border-color:var(--amber)!important}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
h2{font-size:22px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}h2 small{font:500 14px Barlow,sans-serif;color:var(--mute)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 7px;color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.row .nm{font-weight:600;font-size:17px}.row .meta{color:var(--mute);font-size:13.5px}.row .l{flex:1;min-width:0}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.row.in{background:var(--okbg);border-color:var(--ok)}.row.in .box{background:var(--ok);border-color:var(--ok);color:#fff}
.row.in .nm{text-decoration:line-through;text-decoration-thickness:1px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:12px;padding:12px 14px;margin:0 0 9px}.card.rdy{border-left-color:var(--ok)}
.top{display:flex;gap:10px;align-items:baseline}.tm{font-size:18px;color:var(--amber);min-width:62px}
.ttl{font-weight:600;font-size:17px}.art{color:var(--mute);font-size:13.5px}
.tag{margin-left:auto;font:700 13px Barlow,sans-serif;padding:3px 9px;border-radius:999px;background:var(--badbg);color:var(--bad);white-space:nowrap}.rdy .tag{background:var(--okbg);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font:500 13.5px Barlow,sans-serif;border-radius:8px;padding:5px 9px;border:1px solid var(--line);background:none;color:var(--ink)}
.chip.ok{background:var(--okbg);border-color:var(--ok)}.chip.no{background:var(--badbg);border-color:var(--bad);cursor:pointer}.chip.op{border-style:dashed;color:var(--amber);border-color:var(--amber);cursor:pointer}
.chip i{font-style:normal;color:var(--mute);margin-right:5px}
.empty,.err{color:var(--mute);padding:24px 0;text-align:center}.err{color:var(--bad)}
.add{display:flex;gap:8px;margin-top:14px}.add input,select{flex:1;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#dlg.show{display:flex}#dlg>div{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));display:grid;gap:10px}
.note{color:var(--mute);font-size:12.5px;margin-top:18px}
</style></head><body>
<header><h1 id="ttl">Jam Check-in</h1><div class="sub" id="sync">Loading…</div>
<div class="dt"><input type="date" id="dp" aria-label="Event date"><button class="pill" id="dToday">Today</button></div>
<div class="stats"><div class="stat"><b id="sA">0</b><span id="sAl">checked in</span></div><div class="stat"><b id="sB">0</b><span id="sBl">songs ready</span></div></div>
<div class="tabs"><button id="t1" class="on">Check in by time</button><button id="t2">Songs</button><button id="t3">Check in by name</button></div></header>
<main id="main"></main>
<div id="dlg"><div><b id="dT"></b><select id="dS"></select><button class="pill go" id="dOk">Save</button><button class="pill" id="dNo">Cancel</button></div></div>

<script>
"use strict";
/* ---------- config (edit here; ?start=19:30&mins=6 in the URL overrides startTime / minutesPerSong) ---------- */
const CFG = Object.assign({
  apiBase: "/api/checkin",     // nginx proxies this to app.py
  setlistUrl: "https://lastcalllive.rocks/setlist_full",  // returns the CSV; called with ?date=YYYY-MM-DD
  startTime: "18:00",          // the CSV has no times: song N starts at startTime + (N-1) * minutesPerSong
  minutesPerSong: 7,
  callLeadMinutes: 30,         // arrive this long before first song
  tierMinutes: 30,             // size of arrival groups
  pollMs: 3000
}, window.CHECKIN_CONFIG || {});
{ const q = new URLSearchParams(location.search);
  if (/^\d{1,2}:\d{2}$/.test(q.get('start') || '')) CFG.startTime = q.get('start');
  if (+q.get('mins') > 0) CFG.minutesPerSong = +q.get('mins'); }

const ROLES = [["vox","Vox"],["g1","G1"],["g2","G2"],["bass","Bass"],["drums","Drums"],["keys","Keys"],["keys2","Keys 2"]];
const REQUIRED = new Set(["vox","g1","bass","drums"]); // blank here = open spot; blank G2/Keys = not needed. "XX" = not needed.

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = m => { const h = Math.floor(m/60)%24, mm = m%60; return ((h%12)||12)+':'+String(mm).padStart(2,'0')+(h<12?' AM':' PM'); };
const toMin = t => { if (typeof t === 'number') return t; const m = /^(\d{1,2}):(\d{2})$/.exec(String(t||'')); return m ? (+m[1])*60 + (+m[2]) : null; };

const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const date = new URLSearchParams(location.search).get('date') || today();   // no ?date= means today (browser's local date)
{ const q = new URLSearchParams(location.search);                            // keep the address shareable/reloadable
  if (!q.get('date')) { q.set('date', date); history.replaceState(null, '', '?' + q); } }
const goDate = d => { const q = new URLSearchParams(location.search); q.set('date', d); location.search = q.toString(); };
let songs = [], here = new Set(), subs = {}, tab = 1, onlyWait = false, filt = 'all', online = false, dlgKey = null, needLogin = false;

/* ---------- setlist (CSV from the web service) ---------- */
// Columns: date,songnum,song,artist,vocal,guitar1,guitar2,bass,drums,keys,keys2
function parseCSV(text) {                       // handles quoted fields, "" escapes and CRLF
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c == '"') { if (text[i+1] == '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c == '"') q = true;
    else if (c == ',') { row.push(f); f = ''; }
    else if (c == '\n' || c == '\r') { if (c == '\r' && text[i+1] == '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
async function loadSetlist() {
  const r = await fetch(CFG.setlistUrl + '?date=' + encodeURIComponent(date), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = parseCSV((await r.text()).replace(/^\uFEFF/, ''));
  if (rows.length < 2) return [];
  const head = rows[0].map(h => h.trim().toLowerCase()), col = n => head.indexOf(n);
  const get = (row, n) => { const i = col(n); return i < 0 || row[i] == null ? '' : row[i].trim(); };
  const want = date.replace(/-/g, '');
  const base = toMin(CFG.startTime) ?? 1080;
  return rows.slice(1)
    .filter(row => { const d = get(row, 'date').replace(/\D/g, ''); return !d || d == want; })   // ignore rows for other dates
    .map((row, i) => ({ n: parseFloat(get(row, 'songnum')), i, row }))
    .sort((a, b) => ((isNaN(a.n) ? a.i : a.n) - (isNaN(b.n) ? b.i : b.n)) || a.i - b.i)
    .map(({ row }, idx) => ({
      title: get(row, 'song'), artist: get(row, 'artist'),
      start: base + idx * CFG.minutesPerSong,
      players: { vox: get(row, 'vocal'), g1: get(row, 'guitar1'), g2: get(row, 'guitar2'), bass: get(row, 'bass'),
                 drums: get(row, 'drums'), keys: get(row, 'keys'), keys2: get(row, 'keys2') }
    }))
    .filter(s => s.title);
}

/* ---------- derived state ---------- */
const subKey = (song, role) => song.title + '|' + role;
function slots(song) {
  return ROLES.map(([k, label]) => {
    const raw = song.players[k], sub = subs[subKey(song, k)];
    const name = sub !== undefined ? sub : raw;
    if (name === 'XX' || (name === '' && !REQUIRED.has(k))) return null;
    return { k, label, name, sub: sub !== undefined && sub !== '' && sub !== 'XX' ? sub : null };
  }).filter(Boolean);
}
function songState(song) {
  const sl = slots(song), miss = sl.filter(s => !s.name || !here.has(s.name));
  return { sl, miss, ready: miss.length === 0 };
}
function roster() {                     // name -> index of first song (null = walk-in)
  const p = {};
  songs.forEach((song, i) => slots(song).forEach(s => { if (s.name && (!(s.name in p) || p[s.name] > i)) p[s.name] = i; }));
  here.forEach(n => { if (!(n in p)) p[n] = null; });
  return p;
}

/* ---------- render ---------- */
function render() {
  if (!songs.length) return;
  const st = songs.map(songState), ros = roster(), names = Object.keys(ros);
  $('sA').textContent = names.filter(n => here.has(n)).length; $('sAl').textContent = 'of ' + names.length + ' checked in';
  $('sB').textContent = st.filter(x => x.ready).length; $('sBl').textContent = 'of ' + songs.length + ' songs ready';
  $('t1').className = tab == 1 ? 'on' : ''; $('t2').className = tab == 2 ? 'on' : ''; $('t3').className = tab == 3 ? 'on' : '';
  $('sync').textContent = date + (online ? ' · live, shared with all organizers' : ' · offline, retrying…');
  const waitBar = '<div class="bar"><button class="pill'+(onlyWait?' on':'')+'" data-a="wait">Show only people not here yet</button></div>';
  const addBar = '<div class="add"><input id="addN" maxlength="100" placeholder="Add a walk-in or sub by name"><button class="pill go" data-a="add">Check in</button></div>';
  const loginBar = needLogin ? '<div class="bar"><button class="pill go" data-a="login">Log in to edit</button><span class="sub">Changes need an organizer login.</span></div>' : '';
  let h = loginBar;
  if (tab == 1) {
    h += waitBar;
    const tiers = {};
    names.filter(n => ros[n] !== null).forEach(n => {
      const call = songs[ros[n]].start - CFG.callLeadMinutes;
      const t = Math.floor(call / CFG.tierMinutes) * CFG.tierMinutes;
      (tiers[t] = tiers[t] || []).push(n);
    });
    Object.keys(tiers).map(Number).sort((a,b)=>a-b).forEach(t => {
      const all = tiers[t].sort((a,b)=>a.localeCompare(b)), tin = all.filter(n => here.has(n)).length;
      const l = onlyWait ? all.filter(n => !here.has(n)) : all;
      if (!l.length) return;
      h += '<h2>Arrive '+fmt(t)+' – '+fmt(t+CFG.tierMinutes)+'<small>'+tin+' / '+all.length+' here</small></h2>';
      l.forEach(n => { const s = songs[ros[n]], y = here.has(n);
        h += '<button class="row'+(y?' in':'')+'" data-a="tog" data-n="'+esc(n)+'"><span class="box">'+(y?'✓':'')+'</span><span class="l"><span class="nm">'+esc(n)+'</span><br><span class="meta">Call '+fmt(s.start-CFG.callLeadMinutes)+' · first song '+fmt(s.start)+' · '+esc(s.title)+'</span></span></button>'; });
    });
    const w = names.filter(n => ros[n] === null).sort();
    if (w.length) { h += '<h2>Walk-ins<small>not on the setlist</small></h2>';
      w.forEach(n => h += '<button class="row in" data-a="tog" data-n="'+esc(n)+'"><span class="box">✓</span><span class="l"><span class="nm">'+esc(n)+'</span></span></button>'); }
    h += addBar;
  } else if (tab == 3) {
    // every player on the setlist (plus walk-ins), A-Z, independent of song; same tap-to-check-in rows as tab 1
    h += waitBar;
    const all = names.slice().sort((a,b)=>a.localeCompare(b)), tin = all.filter(n => here.has(n)).length;
    const l = onlyWait ? all.filter(n => !here.has(n)) : all;
    h += '<h2>All players<small>'+tin+' / '+all.length+' here</small></h2>';
    l.forEach(n => { const y = here.has(n), s = ros[n] === null ? null : songs[ros[n]];
      h += '<button class="row'+(y?' in':'')+'" data-a="tog" data-n="'+esc(n)+'"><span class="box">'+(y?'✓':'')+'</span><span class="l"><span class="nm">'+esc(n)+'</span>'+
        (s ? '<br><span class="meta">First song '+fmt(s.start)+' · '+esc(s.title)+'</span>' : '<br><span class="meta">Not on the setlist</span>')+'</span></button>'; });
    if (!l.length) h += '<div class="empty">'+(all.length ? 'Everyone is here.' : 'Nobody yet.')+'</div>';
    h += addBar;
  } else {
    h += '<div class="bar">'+[['all','All'],['rdy','Ready now'],['blk','Waiting on people']].map(([k,l]) => '<button class="pill'+(filt==k?' on':'')+'" data-a="f" data-k="'+k+'">'+l+'</button>').join('')+'</div>';
    let c = 0;
    songs.forEach((song, i) => { const x = st[i];
      if ((filt == 'rdy' && !x.ready) || (filt == 'blk' && x.ready)) return; c++;
      h += '<div class="card'+(x.ready?' rdy':'')+'"><div class="top"><span class="tm">'+fmt(song.start)+'</span><span><div class="ttl">'+esc(song.title)+'</div><div class="art">'+esc(song.artist)+'</div></span><span class="tag">'+(x.ready?'Ready':x.miss.length+' missing')+'</span></div><div class="chips">'+
        x.sl.map(q => { const lab = '<i>'+q.label+'</i>', k = esc(subKey(song, q.k));
          if (!q.name) return '<button class="chip op" data-a="sub" data-i="'+i+'" data-r="'+q.k+'">'+lab+'Open – assign</button>';
          return here.has(q.name) ? '<span class="chip ok">'+lab+esc(q.name)+(q.sub?' (sub)':'')+'</span>'
            : '<button class="chip no" data-a="sub" data-i="'+i+'" data-r="'+q.k+'">'+lab+esc(q.name)+' – not here · tap to sub</button>'; }).join('')+'</div></div>'; });
    if (!c) h += '<div class="empty">Nothing here yet.</div>';
  }
  h += '<div class="bar"><button class="pill" data-a="reload">Reload setlist</button></div><div class="note">Blank Vox, G1, Bass or Drums counts as an open spot that blocks a song. Blank G2, Keys or Keys 2, or "XX", means not needed. Song times are estimated from the start time.</div>';
  const y = scrollY; $('main').innerHTML = h; scrollTo(0, y);
}

/* ---------- server sync ---------- */
async function api(path, opts) {
  const r = await fetch(CFG.apiBase + path, Object.assign({ headers: { 'Content-Type': 'application/json' }, cache: 'no-store' }, opts));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function poll() {
  if (document.hidden) return;
  try {
    const s = await api('/state?date=' + encodeURIComponent(date));
    here = new Set(s.here); subs = s.subs || {}; online = true;
  } catch (e) { online = false; }
  render();
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(Object.assign({ date }, body)) }).then(poll, e => { if (/40[13]/.test(e.message)) needLogin = true; online = false; poll(); });
function toggle(name) {
  const on = !here.has(name);
  on ? here.add(name) : here.delete(name); render();        // optimistic; poll() corrects it
  post('/here', { name, here: on });
}
function setSub(song, role, name) {                           // name === null removes the override
  const key = subKey(song, role);
  name === null ? delete subs[key] : subs[key] = name; render();
  post('/sub', { key, name });
}

/* ---------- events ---------- */
$('main').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;
  if (a == 'tog') toggle(b.dataset.n);
  else if (a == 'wait') { onlyWait = !onlyWait; render(); }
  else if (a == 'reload') { b.textContent = 'Reloading…'; loadSetlist().then(l => { if (l.length) songs = l; render(); }, () => { b.textContent = 'Reload failed – tap to retry'; }); }
  else if (a == 'f') { filt = b.dataset.k; render(); }
  else if (a == 'login') { needLogin = false; location.href = CFG.apiBase + '/login'; }
  else if (a == 'add') { const v = $('addN').value.trim(); if (v && !here.has(v)) toggle(v); }
  else if (a == 'sub') {
    const song = songs[+b.dataset.i], role = b.dataset.r; dlgKey = [song, role];
    $('dT').textContent = song.title + ' – ' + ROLES.find(r => r[0] == role)[1] + ': who is playing it?';
    const all = new Set(Object.keys(roster()));
    songs.forEach(s => Object.values(s.players).forEach(n => { if (n && n !== 'XX') all.add(n); }));
    $('dS').innerHTML = '<option value="">Choose…</option>' + [...all].sort().map(n => '<option>'+esc(n)+'</option>').join('') +
      '<option value="XX">Not needed for this song</option><option value="__clear">Undo my change</option>';
    $('dlg').classList.add('show');
  }
});
$('dOk').onclick = () => { const v = $('dS').value; if (v) setSub(dlgKey[0], dlgKey[1], v == '__clear' ? null : v); $('dlg').classList.remove('show'); };
$('dNo').onclick = () => $('dlg').classList.remove('show');
$('dp').onchange = () => { if (DATE_RE.test($('dp').value) && $('dp').value !== date) goDate($('dp').value); };
$('dToday').onclick = () => { if (today() !== date) goDate(today()); };
$('t1').onclick = () => { tab = 1; render(); }; $('t2').onclick = () => { tab = 2; render(); }; $('t3').onclick = () => { tab = 3; render(); };

/* ---------- start ---------- */
(async () => {
  if (!DATE_RE.test(date)) { $('main').innerHTML = '<div class="err">That date isn’t valid. Pick one above, or use an address like ?date=2026-11-01</div>'; $('sync').textContent = ''; return; }
  $('dp').value = date; $('sync').textContent = date;   // render() replaces the sync text once the setlist loads
  try { songs = await loadSetlist(); }
  catch (e) { $('main').innerHTML = '<div class="err">Couldn’t load the setlist from ' + esc(CFG.setlistUrl) + '. Check the connection (or CORS, see README) and reload.</div>'; return; }
  if (!songs.length) { $('main').innerHTML = '<div class="err">No setlist found for ' + esc(date) + '.</div>'; return; }
  $('ttl').textContent = 'Jam Check-in'; document.title = 'Jam Check-in ' + date;
  await poll(); setInterval(poll, CFG.pollMs);
  document.addEventListener('visibilitychange', poll);
})();
</script></body></html>
