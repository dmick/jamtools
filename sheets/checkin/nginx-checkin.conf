# Add inside the existing server { } block.
# /checkin (and /checkin?date=...) serves the page directly, with no redirect.
location = /checkin {
    alias /var/www/jam-checkin/checkin.html;
    add_header Cache-Control "no-cache";
}

location /checkin/ {
    alias /var/www/jam-checkin/;          # checkin.html lives here
    index checkin.html;
    add_header Cache-Control "no-cache";
}

# Page stays viewable by anyone; only changes (anything but GET) need an organizer login.
# The page's "Log in to edit" button navigates here to trigger the browser's password prompt; after
# a successful login the 204 leaves the page in place and the browser reuses the credentials.
# Don't use "return 204" here: return runs before the access phase, so it would skip auth_basic.
# Create the password file with:  sudo htpasswd -c /etc/nginx/htpasswd-checkin USER
# (a missing file makes nginx answer 403, not 401, once credentials are sent).
location = /api/checkin/login {
    auth_basic "Organizers";
    auth_basic_user_file /etc/nginx/htpasswd-checkin;
    try_files /__none =204;
}

location /api/checkin/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    limit_except GET {
        auth_basic "Organizers";      # same realm as the login location, so the browser reuses the login
        auth_basic_user_file /etc/nginx/htpasswd-checkin;
    }
}

