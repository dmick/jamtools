# Add inside the existing server { } block.
location /checkin/ {
    alias /var/www/jam-checkin/;          # checkin.html lives here
    index checkin.html;
    add_header Cache-Control "no-cache";
}

location /api/checkin/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Strongly recommended: restrict who can change check-ins (the API has no login of its own).
    # auth_basic "Organizers";
    # auth_basic_user_file /etc/nginx/.htpasswd-checkin;
}

# Only needed if checkin.html is NOT served from lastcalllive.rocks (browsers block cross-site requests
