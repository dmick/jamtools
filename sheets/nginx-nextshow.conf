# Add inside the existing server { } block, next to wherever /lyrics, /setlist and /setlist_full
# are already proxied to lyrics_server (FastAPI).  If those are covered by a regex or prefix
# location that already matches /nextshow, nothing needs adding.
#
# CHANGE THE PORT to whatever lyrics_server is listening on; 8000 is only a placeholder.
location = /nextshow {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # the app already caches for 60s; don't let browsers/proxies hold it longer than that
    add_header Cache-Control "public, max-age=30";
}
